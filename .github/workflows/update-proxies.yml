name: Update encrypted MTProto proxies

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-proxies.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-mtproto-proxies
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install encryption dependency
        run: python -m pip install --disable-pip-version-check cryptography==46.0.0

      - name: Fetch, parse and encrypt public proxy channel
        shell: python
        run: |
          import base64
          import datetime
          import json
          import os
          import re
          import secrets
          import urllib.request
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.kdf.pbkdf2 import PBKDF2HMAC

          password = os.environ.get("PROXY_PASSWORD", "")
          if len(password) < 16:
              raise RuntimeError("Set the PROXY_PASSWORD Actions secret (at least 16 characters)")

          source = "https://r.jina.ai/https://t.me/s/ProxyMTProto"
          request = urllib.request.Request(source, headers={"User-Agent": "Mozilla/5.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              text = response.read().decode("utf-8", errors="replace")

          lines = text.splitlines()
          proxies = []
          seen = set()
          server_re = re.compile(r"^\s*Server:\s*`?([^`\s]+)`?\s*$", re.I)
          port_re = re.compile(r"^\s*Port:\s*`?(\d{1,5})`?\s*$", re.I | re.M)
          secret_re = re.compile(r"^\s*Secret:\s*`?([^`\s]+)`?\s*$", re.I | re.M)
          valid_server = re.compile(r"^(?:[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?|\d{1,3}(?:\.\d{1,3}){3})$", re.I)
          valid_secret = re.compile(r"^[a-z0-9_=-]{8,512}$", re.I)

          for index, line in enumerate(lines):
              server_match = server_re.match(line)
              if not server_match:
                  continue
              server = server_match.group(1).rstrip(".").strip()
              nearby = "\n".join(lines[index + 1:index + 9])
              port_match = port_re.search(nearby)
              secret_match = secret_re.search(nearby)
              if not port_match or not secret_match or server.lower() == "unknown":
                  continue
              port = int(port_match.group(1))
              secret = secret_match.group(1)
              if not valid_server.fullmatch(server) or not valid_secret.fullmatch(secret) or not 1 <= port <= 65535:
                  continue
              identity = f"{server}:{port}:{secret}"
              if identity in seen:
                  continue
              seen.add(identity)
              proxies.append({"server": server, "port": port, "secret": secret})

          if not proxies:
              raise RuntimeError("No valid proxies found; keeping the previous encrypted list")

          plain = json.dumps({
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "proxies": proxies,
          }, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
          salt = secrets.token_bytes(16)
          iv = secrets.token_bytes(12)
          iterations = 250_000
          key = PBKDF2HMAC(algorithm=hashes.SHA256(), length=32, salt=salt, iterations=iterations).derive(password.encode("utf-8"))
          ciphertext = AESGCM(key).encrypt(iv, plain, None)
          encrypted = {
              "v": 1,
              "alg": "AES-GCM",
              "kdf": "PBKDF2-SHA256",
              "iterations": iterations,
              "salt": base64.b64encode(salt).decode("ascii"),
              "iv": base64.b64encode(iv).decode("ascii"),
              "ciphertext": base64.b64encode(ciphertext).decode("ascii"),
          }
          with open("proxies.enc.json", "w", encoding="utf-8") as output:
              json.dump(encrypted, output, separators=(",", ":"))
              output.write("\n")
          print(f"Encrypted {len(proxies)} proxies")

      - name: Commit updated encrypted list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxies.enc.json
          git diff --cached --quiet && exit 0
          git commit -m "Update encrypted proxy list"
          git push
