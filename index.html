<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f7fa">
  <title>Свежие пупу</title>
  <style>
    :root{--ink:#14243a;--muted:#65758a;--line:#dce5ee;--blue:#2388d9;--blue2:#1475c0;--pale:#eaf5fd;--page:#f3f7fa;--danger:#d25555}
    *{box-sizing:border-box}html{background:var(--page)}body{margin:0;background:radial-gradient(circle at 15% -10%,rgba(35,136,217,.17),transparent 32rem),var(--page);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}button,a{-webkit-tap-highlight-color:transparent}.shell{width:min(100%,720px);min-height:100vh;margin:auto;padding:calc(25px + env(safe-area-inset-top)) 18px calc(36px + env(safe-area-inset-bottom))}.hero{display:flex;align-items:flex-start;gap:15px;padding:12px 2px 25px}.mark{display:grid;flex:0 0 50px;width:50px;height:50px;place-items:center;border-radius:50%;background:linear-gradient(145deg,#4fb5ef,#1582d0);box-shadow:0 9px 24px rgba(31,134,211,.25);color:#fff;font-size:27px;font-weight:700}.eyebrow{margin:1px 0 5px;color:var(--blue2);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}h1{margin:0;font-size:clamp(27px,7vw,38px);line-height:1.08;letter-spacing:-.035em}.subtitle{max-width:520px;margin:10px 0 0;color:var(--muted);font-size:15px;line-height:1.45}.content{border:1px solid rgba(210,222,234,.85);border-radius:22px;background:rgba(255,255,255,.82);box-shadow:0 18px 60px rgba(30,63,92,.09);overflow:hidden;backdrop-filter:blur(16px)}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 15px;border-bottom:1px solid var(--line);background:rgba(250,252,254,.9)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#35b46f;box-shadow:0 0 0 4px rgba(53,180,111,.12)}.dot.loading{background:#e5a22f;box-shadow:0 0 0 4px rgba(229,162,47,.12)}.dot.error{background:var(--danger);box-shadow:0 0 0 4px rgba(210,85,85,.12)}.refresh{display:flex;align-items:center;gap:5px;padding:8px 11px;border:0;border-radius:10px;background:var(--pale);color:var(--blue2);font-size:12px;font-weight:700;cursor:pointer}.refresh:disabled{opacity:.55}.list{padding:8px}.card{padding:15px 13px 12px;border-bottom:1px solid var(--line)}.card:last-child{border-bottom:0}.main{display:flex;align-items:center;gap:11px}.rank{display:grid;flex:0 0 34px;width:34px;height:34px;place-items:center;border-radius:11px;background:#eff4f8;color:#718196;font-size:13px;font-weight:700}.address{min-width:0;display:flex;flex-direction:column;gap:3px}.address strong{overflow:hidden;font-size:15px;text-overflow:ellipsis;white-space:nowrap}.address span{color:var(--muted);font-size:12px}.connect{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:13px;border-radius:13px;background:linear-gradient(180deg,#2e99e7,#1f83cf);box-shadow:0 7px 18px rgba(31,131,207,.22);color:#fff;font-size:15px;font-weight:700;text-decoration:none}.connect:active{transform:translateY(1px);box-shadow:none}.hide{display:block;margin:9px auto 0;padding:5px 12px;border:0;background:transparent;color:#8795a7;font-size:12px}.empty{padding:50px 25px 46px;text-align:center}.empty-icon{display:grid;width:48px;height:48px;margin:0 auto 15px;place-items:center;border-radius:50%;background:var(--pale);color:var(--blue2);font-size:24px;font-weight:700}.empty h2{margin:0;font-size:19px}.empty p{margin:8px auto 17px;color:var(--muted);font-size:14px;line-height:1.5}.empty button,.restore{border:0;border-radius:11px;background:var(--pale);color:var(--blue2);font-weight:700}.empty button{padding:10px 15px}.restore{display:block;margin:4px auto 16px;padding:9px 13px;font-size:12px}footer{padding:18px 12px 0;color:#7b899a;font-size:11px;line-height:1.55;text-align:center}@media(min-width:620px){.shell{padding-top:48px}.card{display:grid;grid-template-columns:minmax(0,1fr) 210px;align-items:center;column-gap:18px}.connect{grid-column:2;grid-row:1;margin-top:0}.hide{grid-column:2;margin-top:7px}}@media(prefers-reduced-motion:reduce){.connect:active{transform:none}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="hero">
      <div class="mark" aria-hidden="true">↗</div>
      <div>
        <p class="eyebrow">Аварийный доступ к БУБУ</p>
        <h1>Свежие пупу</h1>
        <p class="subtitle">Выбери адрес — БУБУ откроется с уже заполненными настройками.</p>
      </div>
    </section>
    <section class="content" aria-live="polite">
      <div class="toolbar">
        <div class="status"><span id="dot" class="dot loading"></span><span id="status">Получаю свежие пупу…</span></div>
        <button id="refresh" class="refresh" type="button">↻ Обновить</button>
      </div>
      <div id="result"></div>
    </section>
    <footer>Источник: публичный канал. Пупу принадлежат сторонним владельцам.</footer>
  </main>
  <script>
    const SOURCE='https://r.jina.ai/https://t.me/s/ProxyMTProto';
    const STORAGE='mtproto-hidden-proxies-v1';
    let proxies=[];
    let hidden=loadHidden();

    function loadHidden(){try{const x=JSON.parse(localStorage.getItem(STORAGE)||'[]');return Array.isArray(x)?x.filter(v=>typeof v==='string'):[]}catch{return[]}}
    function saveHidden(){localStorage.setItem(STORAGE,JSON.stringify(hidden))}
    function validServer(v){return /^(?:[a-z0-9](?:[a-z0-9._-]*[a-z0-9])?|\d{1,3}(?:\.\d{1,3}){3})$/i.test(v)}
    function validSecret(v){return /^[a-z0-9_=-]{8,512}$/i.test(v)}
    function parse(text){
      const lines=text.split(/\r?\n/),found=[],seen=new Set();
      for(let i=0;i<lines.length;i++){
        const sm=lines[i].match(/^\s*Server:\s*`?([^`\s]+)`?\s*$/i);if(!sm)continue;
        const server=sm[1].replace(/\.$/,'').trim();
        const near=lines.slice(i+1,i+9).join('\n');
        const pm=near.match(/^\s*Port:\s*`?(\d{1,5})`?\s*$/im);
        const km=near.match(/^\s*Secret:\s*`?([^`\s]+)`?\s*$/im);
        if(!pm||!km||server.toLowerCase()==='unknown'||!validServer(server)||!validSecret(km[1]))continue;
        const port=Number(pm[1]),secret=km[1];if(port<1||port>65535)continue;
        const id=`${server}:${port}:${secret}`;if(seen.has(id))continue;seen.add(id);
        found.push({id,server,port,secret});
      }
      return found;
    }
    function escapeHtml(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
    function render(){
      const visible=proxies.filter(p=>!hidden.includes(p.id));
      const root=document.getElementById('result');
      if(!visible.length){
        root.innerHTML=`<div class="empty"><div class="empty-icon">⌁</div><h2>${proxies.length?'Все пупу скрыты':'Свежих пупу пока нет'}</h2><p>${proxies.length?'Можно вернуть список и попробовать адреса ещё раз.':'Обнови страницу через несколько минут.'}</p>${proxies.length?'<button id="restoreAll">Вернуть все</button>':''}</div>`;
        document.getElementById('restoreAll')?.addEventListener('click',()=>{hidden=[];saveHidden();render()});return;
      }
      root.innerHTML=`<div class="list">${visible.map((p,i)=>`<article class="card"><div class="main"><span class="rank">${i+1}</span><div class="address"><strong>${escapeHtml(p.server)}</strong><span>Порт ${p.port}</span></div></div><a class="connect" href="tg://proxy?server=${encodeURIComponent(p.server)}&port=${p.port}&secret=${encodeURIComponent(p.secret)}">Открыть в Telegram <span>→</span></a><button class="hide" data-id="${p.id}">Не работает — скрыть</button></article>`).join('')}</div>${hidden.length?`<button id="restore" class="restore">Вернуть скрытые пупу (${hidden.length})</button>`:''}`;
      root.querySelectorAll('.hide').forEach(b=>b.addEventListener('click',()=>{hidden=[...new Set([...hidden,b.dataset.id])];saveHidden();render()}));
      document.getElementById('restore')?.addEventListener('click',()=>{hidden=[];saveHidden();render()});
    }
    function showError(){document.getElementById('result').innerHTML='<div class="empty"><div class="empty-icon">!</div><h2>Не удалось получить список</h2><p>Попробуй обновить страницу через минуту.</p><button id="retry">Повторить</button></div>';document.getElementById('retry').addEventListener('click',load)}
    async function load(){
      const button=document.getElementById('refresh'),dot=document.getElementById('dot'),status=document.getElementById('status');
      button.disabled=true;dot.className='dot loading';status.textContent='Получаю свежие пупу…';
      try{
        const bucket=Math.floor(Date.now()/300000);
        const response=await fetch(`${SOURCE}?refresh=${bucket}`,{cache:'no-store'});if(!response.ok)throw Error(response.status);
        proxies=parse(await response.text());if(!proxies.length)throw Error('empty');
        const time=new Intl.DateTimeFormat('ru-RU',{hour:'2-digit',minute:'2-digit',timeZone:'Europe/Moscow'}).format(new Date());
        dot.className='dot';status.textContent=`Обновлено в ${time} МСК`;render();
      }catch(e){dot.className='dot error';status.textContent='Источник временно недоступен';showError()}finally{button.disabled=false}
    }
    document.getElementById('refresh').addEventListener('click',load);load();
  </script>
</body>
</html>
